<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Line Dance Potluck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --card: rgba(255, 249, 240, 0.84);
    --card-line: rgba(196, 110, 50, 0.35);
    --ink: #4a2414;
    --ink-soft: #85563a;
    --accent: #c9502a;
    --accent-ink: #fff8ee;
    --pill: rgba(251, 226, 196, 0.9);
    --pill-line: #e6b682;
    --field: rgba(255, 246, 234, 0.95);
    --banner-bg: #4a2414;
    --banner-ink: #fdf1e2;
    --title-font: "Rye", "Rockwell", Georgia, serif;
    --body-font: "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --card: rgba(46, 27, 17, 0.86);
      --card-line: rgba(232, 150, 90, 0.35);
      --ink: #fbe9d3;
      --ink-soft: #dcb593;
      --accent: #e8743a;
      --accent-ink: #26170f;
      --pill: rgba(78, 50, 32, 0.95);
      --pill-line: #7a5235;
      --field: rgba(36, 22, 14, 0.95);
      --banner-bg: #fbe9d3;
      --banner-ink: #26170f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --card: rgba(46, 27, 17, 0.86);
    --card-line: rgba(232, 150, 90, 0.35);
    --ink: #fbe9d3;
    --ink-soft: #dcb593;
    --accent: #e8743a;
    --accent-ink: #26170f;
    --pill: rgba(78, 50, 32, 0.95);
    --pill-line: #7a5235;
    --field: rgba(36, 22, 14, 0.95);
    --banner-bg: #fbe9d3;
    --banner-ink: #26170f;
  }

  * { box-sizing: border-box; margin: 0; }
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: #fde9d2; }
  body {
    position: relative;
    font-family: var(--body-font);
    color: var(--ink);
    background: #fde9d2;
    line-height: 1.5;
    overflow-x: hidden;
    min-height: 100%;
  }

  /* ===== The landscape runs the full height of the page ===== */
  .scene {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #fde9d2 0, #f9cf9f 420px, #f6bd83 900px);
  }
  .sun {
    position: absolute;
    top: 70px;
    right: -40px;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    background: #fff4e1;
  }
  .cloud {
    position: absolute;
    left: -5%;
    width: 110%;
    height: 70px;
  }
  .band {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
  }
  .band > svg.crest {
    position: absolute;
    left: 0;
    width: 100%;
    height: 70px;
    bottom: 100%;
    margin-bottom: -1px;
  }
  .b1 { top: 15%; background: #eaa46e; }
  .b2 { top: 31%; background: #e0844a; }
  .b3 { top: 48%; background: #f0b245; }
  .b4 { top: 64%; background: #e79a3c; }
  .b5 { top: 81%; background: #cf6a34; }
  .rows {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(170deg, transparent 0 22px, rgba(160, 70, 20, 0.12) 22px 30px);
  }

  .decor {
    position: absolute;
    transform: translateY(-100%);
  }
  .decor svg { display: block; width: 100%; height: auto; }
  @media (min-width: 900px) {
    .decor { scale: 1.7; transform-origin: 50% 100%; }
    .decor.top-row { scale: 1.15; }
    .sun { width: 340px; height: 340px; right: 4%; }
  }

  .dancefloor {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 210px;
  }
  .planks {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 64px;
    background:
      repeating-linear-gradient(90deg, rgba(60, 25, 10, 0.25) 0 2px, transparent 2px 70px),
      linear-gradient(180deg, #a85a2e, #8a4523);
  }
  .boots {
    position: absolute;
    left: 50%;
    bottom: 40px;
    width: min(100%, 620px);
    transform: translateX(-50%);
  }
  .boots svg { display: block; width: 100%; height: auto; overflow: visible; }
  .leg { transform-box: view-box; animation: step 1.6s ease-in-out infinite; }
  .leg.d2 { animation-delay: -0.4s; }
  .leg.d3 { animation-delay: -0.8s; }
  .leg.d4 { animation-delay: -1.2s; }
  .blades { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes step {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-9deg); }
    50% { transform: rotate(0deg); }
    75% { transform: rotate(7deg); }
  }

  #leaves, #burst {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  #burst { z-index: 3; }

  /* ===== Content ===== */
  .wrap {
    position: relative;
    z-index: 2;
    max-width: 38rem;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 240px;
  }

  .sign {
    position: relative;
    margin: 2.25rem auto 0;
    width: fit-content;
    max-width: 100%;
    padding: 1rem 1.5rem 1.1rem;
    background:
      repeating-linear-gradient(180deg, transparent 0 30px, rgba(50, 20, 8, 0.25) 30px 32px),
      linear-gradient(180deg, #9b522b, #7e3f20);
    border-radius: 0.5rem;
    box-shadow: 0 4px 0 #5b2a14;
  }
  .sign::before, .sign::after {
    content: "";
    position: absolute;
    top: -2.25rem;
    width: 3px;
    height: 2.25rem;
    background: #6b3a1f;
  }
  .sign::before { left: 18%; }
  .sign::after { right: 18%; }
  .sign h1 {
    font-family: var(--title-font);
    font-weight: 400;
    font-size: clamp(2rem, 9vw, 3.75rem);
    line-height: 1.05;
    color: #fff1db;
    text-align: center;
    text-wrap: balance;
    text-shadow: 0 2px 0 rgba(60, 20, 5, 0.5);
  }

  .card {
    margin-top: 1rem;
    background: var(--card);
    border: 1.5px solid var(--card-line);
    border-radius: 1.25rem;
    padding: 1.25rem 1.375rem 1.375rem;
  }
  .intro { margin-top: 9rem; }
  .intro p { font-size: 1.0625rem; }
  .intro p + p { margin-top: 0.75rem; }

  .card > label, .card legend {
    display: block;
    font-weight: 800;
    font-size: 1.0625rem;
    margin-bottom: 0.75rem;
    padding: 0;
  }
  fieldset.card { min-width: 0; }
  .card legend { float: left; width: 100%; }
  .card legend + * { clear: both; }

  .card input[type="text"], .card input[type="tel"], .card textarea {
    width: 100%;
    font: inherit;
    font-size: 1.0625rem;
    color: var(--ink);
    background: var(--field);
    border: 1.5px solid var(--pill-line);
    border-radius: 0.75rem;
    padding: 0.75rem 0.875rem;
  }
  .card textarea { min-height: 5.5rem; resize: vertical; }
  .card input::placeholder, .card textarea::placeholder { color: var(--ink-soft); opacity: 0.85; }
  .card input:focus-visible, .card textarea:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }

  .opts { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .opt { position: relative; }
  .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .opt span {
    display: inline-block;
    font-weight: 600;
    background: var(--pill);
    border: 1.5px solid var(--pill-line);
    border-radius: 999px;
    padding: 0.6rem 1.1rem;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .opt input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt input:disabled + span { cursor: default; }

  .clear {
    margin-top: 0.625rem;
    font: inherit;
    font-size: 0.9rem;
    color: var(--ink-soft);
    background: none;
    border: 0;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .clear[hidden] { display: none; }

  .actions { margin-top: 1.5rem; }
  .submit {
    width: 100%;
    font: inherit;
    font-weight: 800;
    font-size: 1.25rem;
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 999px;
    padding: 1rem 1.5rem;
    cursor: pointer;
    box-shadow: 0 4px 0 #7e2f15;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .submit:active { transform: translateY(2px); box-shadow: 0 2px 0 #7e2f15; }
  .submit:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .submit:disabled { opacity: 0.6; cursor: default; }
  .submit[hidden] { display: none; }

  .done {
    margin-top: 1rem;
    text-align: center;
    font-weight: 800;
    font-size: 1.25rem;
  }
  .done:empty { display: none; }
  .done {
    background: var(--card);
    border: 1.5px solid var(--card-line);
    border-radius: 1rem;
    padding: 0.875rem 1rem;
  }

  .banner {
    position: fixed;
    left: 50%;
    bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 4;
    background: var(--banner-bg);
    color: var(--banner-ink);
    font-size: 0.875rem;
    padding: 0.6rem 1rem;
    border-radius: 0.75rem;
    width: max-content;
    max-width: calc(100% - 2rem);
    text-align: center;
  }
  .banner[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .opt span, .submit { transition: none; }
    .leg, .blades { animation: none; }
  }
</style>
</head>

<script>
  /* ============================================================
     ALL THE TEXT LIVES HERE. Change it to match the Google Form.
     Each question's "entry" is its field ID from a pre-filled link.
     Choice options must match the form's options exactly.
     ============================================================ */
  const FORM = {
    id: "1FAIpQLSe7J4wrS4qIbn4uhDAUyVmPPtukxsjmxGxLB_UUUJPr3krv4w",
    title: "Line Dance Potluck",
    description: [
      "We host Potlucks every Sunday with a different theme each week!",
      "Please fill out your information in the bottom if you would like to attend the upcoming potlucks (especially if we don't already have your contact information/ if you're new here).",
      "This week will be potluck and line dancing lessons from Jaycee!",
      "Additionally, we are opening up the potlucks to different hosts who would like to try it out. The activities/ theme will be determined by the host/hostess. :))"
    ],
    questions: [
      { type: "short", title: "Name", entry: "entry.370441936", autocomplete: "name" },
      { type: "short", title: "Contact Number", entry: "entry.1414244695", inputType: "tel", autocomplete: "tel" },
      { type: "choice", title: "Have you been to a potluck before?", entry: "entry.396172983",
        options: ["yes ofc", "no :("] },
      { type: "choice", title: "How would you like to be contacted/ informed of the potlucks?", entry: "entry.247876647",
        options: ["text (what have been doing)", "email to google form", "both"] },
      { type: "long", title: "Would you be interested in hosting? If so, please state where you live/ where you would be hosting it.", entry: "entry.1925613659" },
      { type: "long", title: "Comments and/or questions", entry: "entry.356994513" }
    ],
    confirmation: "Your response has been recorded."
  };
  /* ============================================================ */

  const connected = FORM.questions.every(q => q.entry.startsWith("entry."));
  const STORE_KEY = "form-sent-" + FORM.id;
  document.getElementById("banner").hidden = connected;

  // ---- Build the page from FORM ----
  document.title = FORM.title;
  document.getElementById("title").textContent = FORM.title;
  const intro = document.getElementById("intro");
  FORM.description.forEach(t => {
    const p = document.createElement("p");
    p.textContent = t;
    intro.append(p);
  });

  const formEl = document.getElementById("form");
  FORM.questions.forEach((q, i) => {
    const id = "q" + i;
    if (q.type === "choice") {
      const fs = document.createElement("fieldset");
      fs.className = "card";
      const lg = document.createElement("legend");
      lg.textContent = q.title;
      fs.append(lg);
      const opts = document.createElement("div");
      opts.className = "opts";
      q.options.forEach(o => {
        const lab = document.createElement("label");
        lab.className = "opt";
        const inp = document.createElement("input");
        inp.type = "radio";
        inp.name = id;
        inp.value = o;
        const span = document.createElement("span");
        span.textContent = o;
        lab.append(inp, span);
        opts.append(lab);
      });
      const clear = document.createElement("button");
      clear.type = "button";
      clear.className = "clear";
      clear.textContent = "Clear selection";
      clear.hidden = true;
      clear.addEventListener("click", () => {
        fs.querySelectorAll("input").forEach(r => { r.checked = false; });
        clear.hidden = true;
      });
      opts.addEventListener("change", () => { clear.hidden = false; });
      fs.append(opts, clear);
      formEl.append(fs);
    } else {
      const wrap = document.createElement("div");
      wrap.className = "card";
      const lab = document.createElement("label");
      lab.htmlFor = id;
      lab.textContent = q.title;
      const field = q.type === "long" ? document.createElement("textarea") : document.createElement("input");
      if (q.type !== "long") field.type = q.inputType || "text";
      if (q.autocomplete) field.autocomplete = q.autocomplete;
      field.id = id;
      field.placeholder = "Your answer";
      wrap.append(lab, field);
      formEl.append(wrap);
    }
  });

  // ---- Submit ----
  const submitBtn = document.getElementById("submit");
  const done = document.getElementById("done");

  function collect() {
    const body = new URLSearchParams();
    FORM.questions.forEach((q, i) => {
      let val = "";
      if (q.type === "choice") {
        const r = formEl.querySelector(`input[name="q${i}"]:checked`);
        val = r ? r.value : "";
      } else {
        val = document.getElementById("q" + i).value.trim();
      }
      if (val && q.entry) body.append(q.entry, val);
    });
    return body;
  }

  function lock() {
    formEl.querySelectorAll("input, textarea, button").forEach(el => { el.disabled = true; });
    submitBtn.hidden = true;
    done.textContent = FORM.confirmation;
  }

  function readSent() { try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; } }
  function saveSent() { try { localStorage.setItem(STORE_KEY, String(Date.now())); } catch (e) {} }

  submitBtn.addEventListener("click", async () => {
    const body = collect();
    if ([...body.keys()].length === 0 && connected) {
      done.textContent = "Fill something in first!";
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";
    try {
      if (connected) {
        await fetch(`https://docs.google.com/forms/d/e/${FORM.id}/formResponse`, {
          method: "POST",
          mode: "no-cors",
          body
        });
      }
      saveSent();
      lock();
      burst();
    } catch (err) {
      console.warn("Send failed", err);
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit";
      done.textContent = "That didn’t go through. Check your connection and try again.";
    }
  });

  if (readSent()) lock();

  /* ================= LEAVES ================= */
  const canvas = document.getElementById("leaves");
  const ctx = canvas.getContext("2d");
  const fg = document.getElementById("burst");
  const ctx2 = fg.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const COLORS = ["#e2622a", "#f08b25", "#f6b23c", "#c9432a", "#d97a1e", "#b8432c"];
  const maple = new Path2D("M0,-10 L2,-5 L6,-7 L5,-2 L10,-1 L6,2 L7,5 L2,4 L1,9 L0,7 L-1,9 L-2,4 L-7,5 L-6,2 L-10,-1 L-5,-2 L-6,-7 L-2,-5 Z");
  const oval = new Path2D("M0,-10 C 6,-5 6,5 0,10 C -6,5 -6,-5 0,-10 Z");
  let w = 0, h = 0;
  let falling = [];
  let flying = [];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  function makeFaller(anywhere) {
    return {
      x: rand(0, w), y: anywhere ? rand(-h * 0.2, h) : rand(-60, -20),
      s: rand(0.7, 1.4), vy: rand(0.35, 0.9), sway: rand(0.4, 1.2), phase: rand(0, 6.28),
      rot: rand(0, 6.28), vr: rand(-0.02, 0.02), color: pick(COLORS),
      shape: Math.random() < 0.55 ? maple : oval, alpha: rand(0.55, 0.9)
    };
  }

  function burst() {
    if (reduceMotion) return;
    const g = 0.28;
    const n = Math.round(Math.min(220, Math.max(120, (w * h) / 2600)));
    const reach = Math.sqrt(2 * g * h);          // speed needed to reach the top
    for (let i = 0; i < n; i++) {
      const origin = i % 3;                       // bottom-left, bottom-right, bottom-center
      const x0 = origin === 0 ? rand(-20, w * 0.12) : origin === 1 ? rand(w * 0.88, w + 20) : rand(w * 0.4, w * 0.6);
      const vy = -reach * rand(0.6, 1.05);
      const tApex = -vy / g;
      const targetX = rand(-0.05, 1.05) * w;      // spread across the whole width
      flying.push({
        x: x0, y: h + 20,
        vx: (targetX - x0) / tApex, vy,
        s: rand(1.6, 3.2), rot: rand(0, 6.28), vr: rand(-0.18, 0.18),
        color: pick(COLORS), shape: Math.random() < 0.6 ? maple : oval,
        alpha: 1, life: 0, delay: Math.floor(rand(0, 36)), phase: rand(0, 6.28)
      });
    }
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    for (const c of [canvas, fg]) { c.width = w * dpr; c.height = h * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round(Math.min(50, (w * h) / 16000));
    falling = Array.from({ length: count }, () => makeFaller(true));
    if (reduceMotion) draw();
  }

  function drawLeaf(l, c) {
    const ctx = c;
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.rot);
    ctx.scale(l.s, l.s);
    ctx.globalAlpha = l.alpha;
    ctx.fillStyle = l.color;
    ctx.fill(l.shape);
    ctx.strokeStyle = "rgba(90, 30, 10, 0.35)";
    ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(0, 12); ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    ctx2.clearRect(0, 0, w, h);
    falling.forEach(l => drawLeaf(l, ctx));
    flying.forEach(l => { if (l.delay <= 0) drawLeaf(l, ctx2); });
  }

  function tick() {
    for (const l of falling) {
      l.phase += 0.015;
      l.y += l.vy;
      l.x += Math.sin(l.phase) * l.sway;
      l.rot += l.vr + Math.sin(l.phase) * 0.01;
      if (l.y > h + 30) Object.assign(l, makeFaller(false));
    }
    for (const l of flying) {
      if (l.delay > 0) { l.delay--; continue; }
      l.life++;
      l.vy += 0.28;
      if (l.vy > 1.5) {                           // drifting down like a real leaf
        l.vy = 1.5;
        l.phase += 0.04;
        l.vx = l.vx * 0.95 + Math.sin(l.phase) * 0.9 * 0.05;
        l.x += Math.sin(l.phase) * 1.1;
        l.vr *= 0.98;
        l.rot += Math.sin(l.phase) * 0.02;
      }
      l.x += l.vx; l.y += l.vy; l.rot += l.vr;
      if (l.life > 380) l.alpha -= 0.006;
    }
    flying = flying.filter(l => l.alpha > 0 && l.y < h + 80);
    draw();
    requestAnimationFrame(tick);
  }

  window.addEventListener("resize", resize);
  resize();
  if (!reduceMotion) {
    burst();
    requestAnimationFrame(tick);
  }
</script>
</body>
</html>
