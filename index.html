<style>
  :root {
    color-scheme: light;
    --card: rgba(255, 249, 240, 0.84);
    --card-line: rgba(196, 110, 50, 0.35);
    --ink: #4a2414;
    --ink-soft: #85563a;
    --accent: #c9502a;
    --accent-ink: #fff8ee;
    --pill: rgba(251, 226, 196, 0.9);
    --pill-line: #e6b682;
    --field: rgba(255, 246, 234, 0.95);
    --banner-bg: #4a2414;
    --error: #b3261e;
    --banner-ink: #fdf1e2;
    --title-font: "Rye", "Rockwell", Georgia, serif;
    --body-font: "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --card: rgba(46, 27, 17, 0.86);
      --card-line: rgba(232, 150, 90, 0.35);
      --ink: #fbe9d3;
      --ink-soft: #dcb593;
      --accent: #e8743a;
      --accent-ink: #26170f;
      --pill: rgba(78, 50, 32, 0.95);
      --pill-line: #7a5235;
      --field: rgba(36, 22, 14, 0.95);
      --banner-bg: #fbe9d3;
      --error: #ff9a8f;
      --banner-ink: #26170f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --card: rgba(46, 27, 17, 0.86);
    --card-line: rgba(232, 150, 90, 0.35);
    --ink: #fbe9d3;
    --ink-soft: #dcb593;
    --accent: #e8743a;
    --accent-ink: #26170f;
    --pill: rgba(78, 50, 32, 0.95);
    --pill-line: #7a5235;
    --field: rgba(36, 22, 14, 0.95);
    --banner-bg: #fbe9d3;
    --error: #ff9a8f;
    --banner-ink: #26170f;
  }

  * { box-sizing: border-box; margin: 0; }
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: #fde9d2; }
  body {
    position: relative;
    font-family: var(--body-font);
    color: var(--ink);
    background: #fde9d2;
    line-height: 1.5;
    overflow-x: hidden;
    min-height: 100%;
  }

  /* ===== The landscape runs the full height of the page ===== */
  .scene {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #fde9d2 0, #f9cf9f 420px, #f6bd83 900px);
  }
  .sun {
    position: absolute;
    top: 70px;
    right: -40px;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    background: #fff4e1;
  }
  .cloud {
    position: absolute;
    left: -5%;
    width: 110%;
    height: 70px;
  }
  .band {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
  }
  .band > svg.crest {
    position: absolute;
    left: 0;
    width: 100%;
    height: 70px;
    bottom: 100%;
    margin-bottom: -1px;
  }
  .b1 { top: 15%; background: #eaa46e; }
  .b2 { top: 31%; background: #e0844a; }
  .b3 { top: 48%; background: #f0b245; }
  .b4 { top: 64%; background: #e79a3c; }
  .b5 { top: 81%; background: #cf6a34; }
  .rows {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(170deg, transparent 0 22px, rgba(160, 70, 20, 0.12) 22px 30px);
  }

  .decor {
    position: absolute;
    transform: translateY(-100%);
  }
  .decor svg { display: block; width: 100%; height: auto; }
  @media (min-width: 900px) {
    .decor { scale: 1.7; transform-origin: 50% 100%; }
    .decor.top-row { scale: 1.15; }
    .sun { width: 340px; height: 340px; right: 4%; }
  }

  .dancefloor {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 210px;
  }
  .planks {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 64px;
    background:
      repeating-linear-gradient(90deg, rgba(60, 25, 10, 0.25) 0 2px, transparent 2px 70px),
      linear-gradient(180deg, #a85a2e, #8a4523);
  }
  .boots {
    position: absolute;
    left: 50%;
    bottom: 40px;
    width: min(100%, 620px);
    transform: translateX(-50%);
  }
  .boots svg { display: block; width: 100%; height: auto; overflow: visible; }
  .leg { transform-box: view-box; animation: step 1.6s ease-in-out infinite; }
  .leg.d2 { animation-delay: -0.4s; }
  .leg.d3 { animation-delay: -0.8s; }
  .leg.d4 { animation-delay: -1.2s; }
  .blades { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes step {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-9deg); }
    50% { transform: rotate(0deg); }
    75% { transform: rotate(7deg); }
  }

  #leaves, #burst {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  #burst { z-index: 4; }

  /* ===== Content ===== */
  .wrap {
    position: relative;
    z-index: 2;
    max-width: 38rem;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 240px;
  }

  .sign {
    position: relative;
    margin: 2.25rem auto 0;
    width: fit-content;
    max-width: 100%;
    padding: 1rem 1.5rem 1.1rem;
    background:
      repeating-linear-gradient(180deg, transparent 0 30px, rgba(50, 20, 8, 0.25) 30px 32px),
      linear-gradient(180deg, #9b522b, #7e3f20);
    border-radius: 0.5rem;
    box-shadow: 0 4px 0 #5b2a14;
  }
  .sign::before, .sign::after {
    content: "";
    position: absolute;
    top: -2.25rem;
    width: 3px;
    height: 2.25rem;
    background: #6b3a1f;
  }
  .sign::before { left: 18%; }
  .sign::after { right: 18%; }
  .sign h1 {
    font-family: var(--title-font);
    font-weight: 400;
    font-size: clamp(2rem, 9vw, 3.75rem);
    line-height: 1.05;
    color: #fff1db;
    text-align: center;
    text-wrap: balance;
    text-shadow: 0 2px 0 rgba(60, 20, 5, 0.5);
  }

  .card {
    margin-top: 1rem;
    background: var(--card);
    border: 1.5px solid var(--card-line);
    border-radius: 1.25rem;
    padding: 1.25rem 1.375rem 1.375rem;
  }
  .intro { margin-top: 9rem; }
  .intro p { font-size: 1.0625rem; }
  .intro p + p { margin-top: 0.75rem; }

  .card > label, .card legend {
    display: block;
    font-weight: 800;
    font-size: 1.0625rem;
    margin-bottom: 0.75rem;
    padding: 0;
  }
  fieldset.card { min-width: 0; }
  .card legend { float: left; width: 100%; }
  .card legend + * { clear: both; }

  .card input[type="text"], .card input[type="tel"], .card textarea {
    width: 100%;
    font: inherit;
    font-size: 1.0625rem;
    color: var(--ink);
    background: var(--field);
    border: 1.5px solid var(--pill-line);
    border-radius: 0.75rem;
    padding: 0.75rem 0.875rem;
  }
  .card textarea { min-height: 5.5rem; resize: vertical; }
  .card input::placeholder, .card textarea::placeholder { color: var(--ink-soft); opacity: 0.85; }
  .card input:focus-visible, .card textarea:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }

  .help { margin: -0.375rem 0 0.75rem; font-size: 0.95rem; color: var(--ink-soft); }
  .req { color: var(--accent); }
  .error { margin-top: 0.5rem; font-size: 0.9rem; font-weight: 600; color: var(--error); }
  .error:empty { display: none; }
  .card.invalid { border-color: var(--error); }
  .section h2 { font-family: var(--title-font); font-weight: 400; font-size: 1.5rem; line-height: 1.15; }
  .section .help { margin: 0.375rem 0 0; }
  .opts { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .opt { position: relative; }
  .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .opt span {
    display: inline-block;
    font-weight: 600;
    background: var(--pill);
    border: 1.5px solid var(--pill-line);
    border-radius: 999px;
    padding: 0.6rem 1.1rem;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .opt input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt input:disabled + span { cursor: default; }

  .clear {
    margin-top: 0.625rem;
    font: inherit;
    font-size: 0.9rem;
    color: var(--ink-soft);
    background: none;
    border: 0;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .clear[hidden] { display: none; }

  .actions { margin-top: 1.5rem; }
  .submit {
    width: 100%;
    font: inherit;
    font-weight: 800;
    font-size: 1.25rem;
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 999px;
    padding: 1rem 1.5rem;
    cursor: pointer;
    box-shadow: 0 4px 0 #7e2f15;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .submit:active { transform: translateY(2px); box-shadow: 0 2px 0 #7e2f15; }
  .submit:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .submit:disabled { opacity: 0.6; cursor: default; }
  .submit[hidden] { display: none; }

  .done {
    margin-top: 1rem;
    text-align: center;
    font-weight: 800;
    font-size: 1.25rem;
  }
  .done:empty { display: none; }
  .done {
    background: var(--card);
    border: 1.5px solid var(--card-line);
    border-radius: 1rem;
    padding: 0.875rem 1rem;
  }

  .banner {
    position: fixed;
    left: 50%;
    bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 5;
    background: var(--banner-bg);
    color: var(--banner-ink);
    font-size: 0.875rem;
    padding: 0.6rem 1rem;
    border-radius: 0.75rem;
    width: max-content;
    max-width: calc(100% - 2rem);
    text-align: center;
  }
  .banner[hidden] { display: none; }


  /* ===== Two-step flow ===== */
  .view[hidden] { display: none; }
  .flyer { padding: 0.625rem; }
  .flyer img { display: block; width: 100%; height: auto; border-radius: 0.875rem; }
  .gate legend { text-align: center; font-size: 1.25rem; margin-bottom: 1rem; }
  .gate-btns { display: grid; gap: 0.75rem; }
  .gate-btn {
    font: inherit;
    font-weight: 800;
    font-size: 1.1875rem;
    border-radius: 999px;
    padding: 1rem 1.25rem;
    cursor: pointer;
    border: 2px solid var(--accent);
    transition: transform 0.15s ease, opacity 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .gate-btn { background: transparent; color: var(--ink); }
  .gate:not(.answered) .gate-btn.yes,
  .gate-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 #7e2f15; }
  .gate-btn:active { transform: translateY(2px); }
  .gate-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .gate-btn:disabled { opacity: 0.6; cursor: default; }
  .back {
    margin-top: 1rem;
    display: block;
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--card-line);
    border-radius: 999px;
    padding: 0.5rem 1rem;
    cursor: pointer;
  }
  .back:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .back[hidden] { display: none; }
  .bye { text-align: center; padding: 2rem 1.5rem; }
  .bye h2 { font-family: var(--title-font); font-weight: 400; font-size: clamp(2rem, 9vw, 3rem); line-height: 1.1; }
  .bye p { margin-top: 0.75rem; font-size: 1.0625rem; color: var(--ink-soft); }
  .reveal { animation: reveal 0.9s ease both; animation-delay: 0.35s; }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .opt span, .submit, .gate-btn { transition: none; }
    .reveal { animation: none; }
    .leg, .blades { animation: none; }
  }
</style>
</head>

<script>
  /* ============================================================
     SYNC (optional): paste the Web app URL from the form's Apps Script.
     When set, the page loads the form's current text on every visit.
     ============================================================ */
  const SYNC_URL = "";

  /* Backup copy of the form. {type:"page"} marks Google's "Next" page break.
     The first multiple-choice question on page 1 becomes the RSVP buttons:
     its FIRST option leads to page 2, any other option goes to "See you next time!". */
  const FORM_ID = "1FAIpQLSe7J4wrS4qIbn4uhDAUyVmPPtukxsjmxGxLB_UUUJPr3krv4w";
  const BACKUP = {
    title: "Country Dancing Friendsgiving Potluck",
    description: [
      "This week will be potluck and line dancing lessons from Jaycee!"
    ],
    questions: [
      { type: "choice", title: "Will you attend the Friendsgiving on Nov 15th?", entry: "entry.579283406",
        options: ["Yes I am so hyped!", "No not this time :("] },
      { type: "page" },
      { type: "short", title: "Name", entry: "entry.370441936" },
      { type: "short", title: "Contact Number", entry: "entry.1414244695" },
      { type: "choice", title: "Have you been to a potluck before?", entry: "entry.396172983",
        options: ["yes ofc", "no :("] },
      { type: "choice", title: "How would you like to be contacted/ informed of the potlucks?", entry: "entry.247876647",
        options: ["text (what have been doing)", "email to google form", "both"] },
      { type: "long", title: "Would you be interested in hosting? If so, please state where you live/ where you would be hosting it.", entry: "entry.1925613659" },
      { type: "long", title: "Comments and/or questions", entry: "entry.356994513" }
    ],
    confirmation: "Your response has been recorded.",
    accepting: true
  };
  /* ============================================================ */

  const $ = id => document.getElementById(id);
  const views = { form: $("view-form"), bye: $("view-bye") };
  const formEl = $("form");
  const submitBtn = $("submit");
  const done = $("done");
  $("banner").hidden = true;

  let FORM = BACKUP;
  let gate = null;          // the RSVP question
  let gateAnswer = null;
  let page1 = [], later = [], pageCount = 1;
  let touched = false;
  formEl.addEventListener("input", () => { touched = true; });
  formEl.addEventListener("change", () => { touched = true; });

  // A new week's description gives everyone a fresh RSVP.
  function hash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }
  function storeKey() { return "rsvp-" + FORM_ID + "-" + hash(FORM.description.join("|") + (gate ? gate.title : "")); }
  function readSent() { try { return localStorage.getItem(storeKey()); } catch (e) { return null; } }
  function saveSent(v) { try { localStorage.setItem(storeKey(), v); } catch (e) {} }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // Show what goes under the RSVP buttons: "form", "bye", or nothing.
  function showBelow(name, animate) {
    Object.entries(views).forEach(([k, v]) => {
      v.hidden = k !== name;
      v.classList.remove("reveal");
    });
    const target = views[name];
    if (!target) return;
    if (animate && !reduceMotion) {
      void target.offsetWidth;
      target.classList.add("reveal");
      leafCurtain();
      setTimeout(() => target.scrollIntoView({ behavior: "smooth", block: "start" }), 450);
    }
  }

  function markGate(value) {
    $("gate").classList.toggle("answered", value != null);
    $("gate").hidden = !gate || value != null;   // the question goes away once answered
    document.querySelectorAll(".gate-btn").forEach(b => {
      b.setAttribute("aria-pressed", String(b.textContent === value));
    });
  }

  function split() {
    page1 = []; later = []; pageCount = 1;
    let onFirst = true;
    FORM.questions.forEach((q, i) => {
      const item = Object.assign({ idx: i }, q);
      if (q.type === "page") {
        if (onFirst) onFirst = false;
        else pageCount++;
        // A section's own title/description shows at the top of its page.
        if (q.title || q.help) later.push(Object.assign(item, { type: "header" }));
        return;
      }
      (onFirst ? page1 : later).push(item);
    });
    if (!onFirst) pageCount++;
    gate = page1.find(q => q.type === "choice") || null;
    page1 = page1.filter(q => q !== gate);
  }

  function addTitle(parent, q, tag, forId) {
    const t = el(tag, null, q.title);
    if (forId) t.htmlFor = forId;
    if (q.required) {
      const star = el("span", "req", " *");
      star.setAttribute("aria-label", "required");
      t.append(star);
    }
    parent.append(t);
    if (q.help) parent.append(el("p", "help", q.help));
  }

  function renderItems(list, container) {
    container.textContent = "";
    list.forEach(q => {
      const id = "q" + q.idx;
      if (q.type === "header") {
        const card = el("div", "card section");
        card.append(el("h2", null, q.title));
        if (q.help) card.append(el("p", "help", q.help));
        container.append(card);
        return;
      }
      if (q.type === "choice" || q.type === "checkbox") {
        const fs = el("fieldset", "card");
        fs.dataset.q = q.idx;
        addTitle(fs, q, "legend");
        const opts = el("div", "opts");
        q.options.forEach(o => {
          const lab = el("label", "opt");
          const inp = document.createElement("input");
          inp.type = q.type === "choice" ? "radio" : "checkbox";
          inp.name = id;
          inp.value = o;
          lab.append(inp, el("span", null, o));
          opts.append(lab);
        });
        fs.append(opts);
        if (q.type === "choice") {
          const clear = el("button", "clear", "Clear selection");
          clear.type = "button";
          clear.hidden = true;
          clear.addEventListener("click", () => {
            fs.querySelectorAll("input").forEach(r => { r.checked = false; });
            clear.hidden = true;
          });
          opts.addEventListener("change", () => { clear.hidden = false; });
          fs.append(clear);
        }
        fs.append(el("p", "error"));
        container.append(fs);
        return;
      }
      const card = el("div", "card");
      card.dataset.q = q.idx;
      addTitle(card, q, "label", id);
      const field = q.type === "long" ? document.createElement("textarea") : document.createElement("input");
      if (q.type !== "long") {
        const t = q.title.toLowerCase();
        field.type = /phone|number|cell/.test(t) ? "tel" : /email/.test(t) ? "email" : "text";
        if (t === "name" || t === "your name") field.autocomplete = "name";
        if (field.type === "tel") field.autocomplete = "tel";
        if (field.type === "email") field.autocomplete = "email";
      }
      field.id = id;
      field.placeholder = "Your answer";
      card.append(field, el("p", "error"));
      container.append(card);
    });
  }

  function renderIntro() {
    document.title = FORM.title;   // shows in the browser tab and link previews
  }

  function renderGate() {
    const box = $("gate-btns");
    box.textContent = "";
    if (!gate) { $("gate").hidden = true; return; }
    $("gate-q").textContent = gate.title;
    gate.options.forEach((o, n) => {
      const btn = el("button", "gate-btn " + (n === 0 ? "yes" : "no"), o);
      btn.type = "button";
      btn.setAttribute("aria-pressed", "false");
      btn.addEventListener("click", () => choose(o, n === 0));
      box.append(btn);
    });
  }

  function render() {
    split();
    renderIntro();
    renderItems(page1, $("page1-extra"));
    renderGate();
    renderItems(later, formEl);
    submitBtn.hidden = false;
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit";
    done.textContent = "";

    const sent = readSent();
    if (FORM.accepting === false) {
      markGate(null);
      showBelow("form");
      formEl.textContent = "";
      lockForm("This form is no longer accepting responses.");
    } else if (sent === "no") {
      gateAnswer = { value: gate.options[1], yes: false };
      markGate(gate.options[1]);
      showBelow("bye");
    } else if (sent) {
      gateAnswer = { value: gate.options[0], yes: true };
      markGate(gate.options[0]);
      showBelow("form");
      lockForm();
    } else if (gateAnswer) {
      markGate(gateAnswer.value);
      showBelow(gateAnswer.yes ? "form" : "bye");
    } else {
      markGate(null);
      showBelow(null);
    }
  }

  function valueOf(q) {
    if (q.type === "choice") {
      const r = document.querySelector(`input[name="q${q.idx}"]:checked`);
      return r ? [r.value] : [];
    }
    if (q.type === "checkbox") {
      return Array.from(document.querySelectorAll(`input[name="q${q.idx}"]:checked`)).map(c => c.value);
    }
    const f = $("q" + q.idx);
    const v = f ? f.value.trim() : "";
    return v ? [v] : [];
  }

  function validate(list) {
    let first = null;
    list.forEach(q => {
      if (q.type === "header") return;
      const card = document.querySelector(`[data-q="${q.idx}"]`);
      if (!card) return;
      const missing = q.required && valueOf(q).length === 0;
      card.classList.toggle("invalid", missing);
      card.querySelector(".error").textContent = missing ? "This is a required question" : "";
      if (missing && !first) first = card;
    });
    if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
    return !first;
  }

  function buildBody(includeLater) {
    const body = new URLSearchParams();
    if (gate && gateAnswer) body.append(gate.entry, gateAnswer.value);
    const lists = includeLater ? page1.concat(later) : page1;
    lists.forEach(q => { if (q.entry) valueOf(q).forEach(v => body.append(q.entry, v)); });
    // Tell Google which pages were visited, so multi-page answers are kept.
    const pages = includeLater ? Array.from({ length: pageCount }, (_, i) => i).join(",") : "0";
    body.append("pageHistory", pages);
    return body;
  }

  async function sendToGoogle(body) {
    // Google doesn't let other sites read its reply ("no-cors"),
    // so we send the answers and trust they landed, like a normal form.
    await fetch(`https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    });
  }

  function lockForm(message) {
    formEl.querySelectorAll("input, textarea, button").forEach(n => { n.disabled = true; });
    document.querySelectorAll(".gate-btn").forEach(b => { b.disabled = true; });
    submitBtn.hidden = true;
    done.textContent = message || FORM.confirmation;
  }

  async function choose(value, yes) {
    if (gateAnswer && gateAnswer.value === value) return;
    if (!validate(page1)) return;
    gateAnswer = { value, yes };
    markGate(value);
    if (yes) {
      showBelow("form", true);
      return;
    }
    showBelow("bye", true);
    document.querySelectorAll(".gate-btn").forEach(b => { b.disabled = true; });
    try { await sendToGoogle(buildBody(false)); } catch (e) { console.warn("Send failed", e); }
    saveSent("no");
    document.querySelectorAll(".gate-btn").forEach(b => { b.disabled = false; });
  }

  submitBtn.addEventListener("click", async () => {
    if (!validate(later)) return;
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";
    try {
      await sendToGoogle(buildBody(true));
      saveSent("yes");
      lockForm();
      burst();
    } catch (err) {
      console.warn("Send failed", err);
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit";
      done.textContent = "That didn’t go through. Check your connection and try again.";
    }
  });

  // Show the backup right away, then swap in the live form text.
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  render();
  if (SYNC_URL) {
    fetch(SYNC_URL)
      .then(r => r.json())
      .then(data => {
        if (!data || !Array.isArray(data.questions)) return;
        const same = JSON.stringify(data) === JSON.stringify(FORM);
        FORM = data;
        if (same) return;
        if (!touched && !gateAnswer) render();
        else renderIntro();
      })
      .catch(err => console.warn("Sync failed, using backup text", err));
  }

  /* ================= LEAVES ================= */
  const canvas = document.getElementById("leaves");
  const ctx = canvas.getContext("2d");
  const fg = document.getElementById("burst");
  const ctx2 = fg.getContext("2d");
  const COLORS = ["#e2622a", "#f08b25", "#f6b23c", "#c9432a", "#d97a1e", "#b8432c"];
  const maple = new Path2D("M0,-10 L2,-5 L6,-7 L5,-2 L10,-1 L6,2 L7,5 L2,4 L1,9 L0,7 L-1,9 L-2,4 L-7,5 L-6,2 L-10,-1 L-5,-2 L-6,-7 L-2,-5 Z");
  const oval = new Path2D("M0,-10 C 6,-5 6,5 0,10 C -6,5 -6,-5 0,-10 Z");
  let w = 0, h = 0;
  let falling = [];
  let flying = [];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  function makeFaller(anywhere) {
    return {
      x: rand(0, w), y: anywhere ? rand(-h * 0.2, h) : rand(-60, -20),
      s: rand(0.7, 1.4), vy: rand(0.35, 0.9), sway: rand(0.4, 1.2), phase: rand(0, 6.28),
      rot: rand(0, 6.28), vr: rand(-0.02, 0.02), color: pick(COLORS),
      shape: Math.random() < 0.55 ? maple : oval, alpha: rand(0.55, 0.9)
    };
  }

  function burst() {
    if (reduceMotion) return;
    const g = 0.28;
    const n = Math.round(Math.min(220, Math.max(120, (w * h) / 2600)));
    const reach = Math.sqrt(2 * g * h);          // speed needed to reach the top
    for (let i = 0; i < n; i++) {
      const origin = i % 3;                       // bottom-left, bottom-right, bottom-center
      const x0 = origin === 0 ? rand(-20, w * 0.12) : origin === 1 ? rand(w * 0.88, w + 20) : rand(w * 0.4, w * 0.6);
      const vy = -reach * rand(0.6, 1.05);
      const tApex = -vy / g;
      const targetX = rand(-0.05, 1.05) * w;      // spread across the whole width
      flying.push({
        x: x0, y: h + 20,
        vx: (targetX - x0) / tApex, vy,
        s: rand(1.6, 3.2), rot: rand(0, 6.28), vr: rand(-0.18, 0.18),
        color: pick(COLORS), shape: Math.random() < 0.6 ? maple : oval,
        alpha: 1, life: 0, delay: Math.floor(rand(0, 36)), phase: rand(0, 6.28)
      });
    }
  }

  function leafCurtain() {
    const n = Math.round(Math.min(260, Math.max(150, (w * h) / 2000)));
    for (let i = 0; i < n; i++) {
      flying.push({
        x: rand(-20, w + 20), y: rand(-h * 0.9, -30),
        vx: rand(-0.6, 0.6), vy: rand(9, 14), cap: rand(9, 14),
        s: rand(1.6, 3.2), rot: rand(0, 6.28), vr: rand(-0.15, 0.15),
        color: pick(COLORS), shape: Math.random() < 0.6 ? maple : oval,
        alpha: 1, life: 0, delay: Math.floor(rand(0, 10)), phase: rand(0, 6.28)
      });
    }
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    for (const c of [canvas, fg]) { c.width = w * dpr; c.height = h * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round(Math.min(50, (w * h) / 16000));
    falling = Array.from({ length: count }, () => makeFaller(true));
    if (reduceMotion) draw();
  }

  function drawLeaf(l, c) {
    const ctx = c;
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.rot);
    ctx.scale(l.s, l.s);
    ctx.globalAlpha = l.alpha;
    ctx.fillStyle = l.color;
    ctx.fill(l.shape);
    ctx.strokeStyle = "rgba(90, 30, 10, 0.35)";
    ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(0, 12); ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    ctx2.clearRect(0, 0, w, h);
    falling.forEach(l => drawLeaf(l, ctx));
    flying.forEach(l => { if (l.delay <= 0) drawLeaf(l, ctx2); });
  }

  function tick() {
    for (const l of falling) {
      l.phase += 0.015;
      l.y += l.vy;
      l.x += Math.sin(l.phase) * l.sway;
      l.rot += l.vr + Math.sin(l.phase) * 0.01;
      if (l.y > h + 30) Object.assign(l, makeFaller(false));
    }
    for (const l of flying) {
      if (l.delay > 0) { l.delay--; continue; }
      l.life++;
      l.vy += 0.28;
      if (l.cap) l.cap = Math.max(1.5, l.cap - 0.06);
      if (l.vy > (l.cap || 1.5)) {                           // drifting down like a real leaf
        l.vy = l.cap || 1.5;
        l.phase += 0.04;
        l.vx = l.vx * 0.95 + Math.sin(l.phase) * 0.9 * 0.05;
        l.x += Math.sin(l.phase) * 1.1;
        l.vr *= 0.98;
        l.rot += Math.sin(l.phase) * 0.02;
      }
      l.x += l.vx; l.y += l.vy; l.rot += l.vr;
      if (l.life > 380) l.alpha -= 0.006;
    }
    flying = flying.filter(l => l.alpha > 0 && l.y < h + 80);
    draw();
    requestAnimationFrame(tick);
  }

  window.addEventListener("resize", resize);
  resize();
  if (!reduceMotion) {
    burst();
    requestAnimationFrame(tick);
  }
</script>
</body>
</html>
