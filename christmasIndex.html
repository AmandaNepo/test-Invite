<style>
  :root {
    color-scheme: light;
    --card: rgba(255, 248, 238, 0.9);
    --card-line: rgba(160, 40, 30, 0.28);
    --ink: #3d1a12;
    --ink-soft: #7d4a3a;
    --accent: #b8262b;
    --accent-ink: #fff8ee;
    --accent-shadow: #6e1214;
    --pill: rgba(250, 230, 210, 0.95);
    --pill-line: #e2b48f;
    --error: #b3261e;
    --title-font: "Mountains of Christmas", "Georgia", serif;
    --body-font: "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --card: rgba(48, 22, 16, 0.9);
      --card-line: rgba(240, 170, 120, 0.3);
      --ink: #fbeadb;
      --ink-soft: #e0b89c;
      --accent: #d9393d;
      --accent-ink: #fff8ee;
      --pill: rgba(80, 38, 28, 0.95);
      --pill-line: #8a5038;
      --error: #ff9a8f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --card: rgba(48, 22, 16, 0.9);
    --card-line: rgba(240, 170, 120, 0.3);
    --ink: #fbeadb;
    --ink-soft: #e0b89c;
    --accent: #d9393d;
    --accent-ink: #fff8ee;
    --pill: rgba(80, 38, 28, 0.95);
    --pill-line: #8a5038;
    --error: #ff9a8f;
  }

  * { box-sizing: border-box; margin: 0; }
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { background: #a8683c; }
  body {
    position: relative;
    min-height: 100vh;
    font-family: var(--body-font);
    color: var(--ink);
    background: #a8683c;
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* ===== Cozy workshop: runs the full page height ===== */
  .scene {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background:
      repeating-linear-gradient(90deg, rgba(70, 30, 12, 0.22) 0 2px, transparent 2px 58px),
      repeating-linear-gradient(90deg, transparent 0 20px, rgba(255, 220, 170, 0.06) 20px 40px),
      linear-gradient(180deg, #a8683c, #b97a4a 40%, #a46638);
  }
  .glow {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 200, 120, 0.45), rgba(255, 200, 120, 0) 70%);
    pointer-events: none;
  }
  .beam { position: absolute; top: 0; left: 0; right: 0; height: 26px; background: #6b3418; box-shadow: 0 4px 0 #4e240f; }
  .garland {
    position: absolute;
    left: 0;
    width: 100%;
    height: 70px;
  }
  .bulb { animation: twinkle 1.8s ease-in-out infinite; }
  .bulb:nth-of-type(2n) { animation-delay: -0.6s; }
  .bulb:nth-of-type(3n) { animation-delay: -1.2s; }
  @keyframes twinkle { 50% { opacity: 0.35; } }

  .shelf {
    position: absolute;
    height: 12px;
    background: #8a4a26;
    box-shadow: 0 5px 0 #5e2f16;
    border-radius: 3px;
  }
  .prop {
    position: absolute;
    transform: translateY(-100%);
  }
  .prop svg { display: block; width: 100%; height: auto; overflow: visible; }

  .floor {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 120px;
    background:
      repeating-linear-gradient(100deg, rgba(90, 45, 20, 0.25) 0 2px, transparent 2px 70px),
      linear-gradient(180deg, #d9a66f, #c48e58);
  }
  .rug {
    position: absolute;
    left: 50%;
    bottom: 22px;
    width: min(80%, 520px);
    height: 46px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: repeating-radial-gradient(ellipse, #b8262b 0 8px, #2f6b3a 8px 14px, #e9c46a 14px 18px);
    opacity: 0.85;
  }

  /* ===== Elves ===== */
  .walker {
    position: absolute;
    width: 46px;
    animation: walk var(--dur, 14s) linear infinite;
    animation-delay: var(--delay, 0s);
  }
  .walker svg { display: block; width: 100%; height: auto; overflow: visible; }
  .walker .flip { animation: face var(--dur, 14s) steps(1) infinite; animation-delay: var(--delay, 0s); transform-origin: center; }
  .walker .bob { animation: bob 0.45s ease-in-out infinite; }
  .walker .legA { animation: legs 0.45s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
  .walker .legB { animation: legs 0.45s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: top center; }
  @keyframes walk {
    0% { left: var(--from); }
    50% { left: var(--to); }
    100% { left: var(--from); }
  }
  @keyframes face { 0% { transform: scaleX(1); } 50% { transform: scaleX(-1); } }
  @keyframes bob { 50% { transform: translateY(-2px); } }
  @keyframes legs { 0%, 100% { transform: rotate(18deg); } 50% { transform: rotate(-18deg); } }
  .hammer-arm { animation: hammer 0.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 10% 10%; }
  @keyframes hammer { 0%, 100% { transform: rotate(-40deg); } 45% { transform: rotate(25deg); } }
  .spark { animation: spark 0.6s ease-out infinite; opacity: 0; }
  @keyframes spark { 40% { opacity: 0; } 50% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.8); } }
  .flame { animation: flicker 0.35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom center; }
  @keyframes flicker { to { transform: scaleY(0.85) scaleX(1.06); } }
  .wave { animation: wave 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 15% 90%; }
  @keyframes wave { 50% { transform: rotate(-25deg); } }

  #fallers, #burst {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  #burst { z-index: 4; }

  /* ===== Content ===== */
  .wrap {
    position: relative;
    z-index: 2;
    max-width: 36rem;
    margin: 0 auto;
    padding: 5.5rem 1.25rem 240px;
  }
  .sign {
    position: relative;
    margin: 0 auto;
    width: fit-content;
    max-width: 100%;
    padding: 0.6rem 1.6rem 0.8rem;
    background: #b8262b;
    border: 4px solid #e9c46a;
    border-radius: 1rem;
    box-shadow: 0 6px 0 #6e1214;
  }
  .sign h1 {
    font-family: var(--title-font);
    font-weight: 700;
    font-size: clamp(2.6rem, 12vw, 4.5rem);
    line-height: 1;
    color: #fff4e0;
    text-align: center;
    text-wrap: balance;
    text-shadow: 0 3px 0 rgba(60, 10, 5, 0.45);
  }
  .card {
    margin-top: 1rem;
    background: var(--card);
    border: 1.5px solid var(--card-line);
    border-radius: 1.25rem;
    padding: 1.25rem 1.375rem 1.375rem;
  }
  .gate, #view-form, #view-bye { margin-top: 1.5rem; }
  #view-form > form > .card:first-child { margin-top: 0; }
  #view-form .actions { margin-top: 0; }
  fieldset.card { min-width: 0; }
  .card legend {
    float: left;
    width: 100%;
    display: block;
    font-weight: 800;
    font-size: 1.125rem;
    margin-bottom: 0.875rem;
    padding: 0;
  }
  .card legend + * { clear: both; }
  .card > label { display: block; font-weight: 800; font-size: 1.125rem; margin-bottom: 0.75rem; }
  #pre .card:first-child { margin-top: 1.5rem; }
  #pre .card + .card, #pre + .gate { margin-top: 1rem; }
  .gate legend { text-align: center; font-size: 1.3rem; margin-bottom: 1rem; }
  .req { color: var(--accent); }
  .help { margin: -0.375rem 0 0.75rem; font-size: 0.95rem; color: var(--ink-soft); }
  .error { margin-top: 0.5rem; font-size: 0.9rem; font-weight: 600; color: var(--error); }
  .error:empty { display: none; }
  .card.invalid { border-color: var(--error); }

  .gate-btns { display: grid; gap: 0.75rem; }
  .gate-btn {
    font: inherit;
    font-weight: 800;
    font-size: 1.1875rem;
    border-radius: 999px;
    padding: 1rem 1.25rem;
    cursor: pointer;
    border: 2px solid var(--accent);
    background: transparent;
    color: var(--ink);
    transition: transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .gate-btn.yes { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-shadow); }
  .gate-btn:active { transform: translateY(2px); }
  .gate-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .gate-btn:disabled { opacity: 0.6; cursor: default; }

  .opts { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .opt { position: relative; }
  .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .opt span {
    display: inline-block;
    font-weight: 600;
    background: var(--pill);
    border: 1.5px solid var(--pill-line);
    border-radius: 999px;
    padding: 0.6rem 1.1rem;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .opt input:checked + span { background: #2f6b3a; border-color: #2f6b3a; color: #fff8ee; }
  .opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt input:disabled + span { cursor: default; }
  .clear {
    margin-top: 0.625rem;
    font: inherit;
    font-size: 0.9rem;
    color: var(--ink-soft);
    background: none;
    border: 0;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .clear[hidden] { display: none; }
  .card input[type="text"]:focus-visible, .card textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .card input[type="text"], .card textarea {
    width: 100%;
    font: inherit;
    font-size: 1.0625rem;
    color: var(--ink);
    background: var(--pill);
    border: 1.5px solid var(--pill-line);
    border-radius: 0.75rem;
    padding: 0.75rem 0.875rem;
  }
  .card textarea { min-height: 5.5rem; resize: vertical; }

  .actions { margin-top: 1.25rem; }
  .submit {
    width: 100%;
    font: inherit;
    font-weight: 800;
    font-size: 1.25rem;
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 999px;
    padding: 1rem 1.5rem;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--accent-shadow);
  }
  .submit:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent-shadow); }
  .submit:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .submit:disabled { opacity: 0.6; cursor: default; }
  .submit[hidden] { display: none; }
  .done {
    margin-top: 1rem;
    text-align: center;
    font-weight: 800;
    font-size: 1.25rem;
    background: var(--card);
    border: 1.5px solid var(--card-line);
    border-radius: 1rem;
    padding: 0.875rem 1rem;
  }
  .done:empty { display: none; }
  .bye { text-align: center; padding: 2rem 1.5rem; }
  .bye h2 { font-family: var(--title-font); font-weight: 700; font-size: clamp(2.2rem, 10vw, 3.25rem); line-height: 1.05; }

  .view[hidden], [hidden] { display: none !important; }
  .reveal { animation: reveal 0.7s ease; }
  @keyframes reveal { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

  @media (min-width: 900px) {
    .prop, .walker { scale: 1.4; transform-origin: 50% 100%; }
    .gate, #view-form, #view-bye { margin-top: 2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .walker, .walker *, .bulb, .hammer-arm, .spark, .flame, .wave, .reveal { animation: none !important; }
  }
</style>
</head>

<canvas id="fallers" aria-hidden="true"></canvas>
<canvas id="burst" aria-hidden="true"></canvas>

<div class="wrap">
  <header class="sign"><h1 id="title">Christmas Escape</h1></header>

  <div id="pre"></div>
  <div class="actions">
    <button class="submit" id="submit" type="button">Submit</button>
    <p class="done" id="done" aria-live="polite"></p>
  </div>

</div>

<script>
  /* ============================================================
     ALL THE TEXT LIVES HERE. Match it to the Google Form.
     Answer options must match the form's options exactly.
     ============================================================ */
  const FORM = {
    id: "1FAIpQLScd6i9ItDS4oPnSArDTiATeQmzJPbzcllDOKCj5uzAxXBd9Pw",
    title: "Christmas Escape",
    questions: [
      { type: "short", title: "Name (first and last)", entry: "entry.1428350631", required: true },
      { type: "choice", title: "Which day do you plan to go?", entry: "entry.1570402101",
        options: ["Saturday, Dec 5th", "Sunday, Dec 6th", "Monday, Dec 7th", "Tuesday, Dec 8th", "idk rn but im def pulling up"] }
    ],
    confirmation: "Your response has been recorded."
  };
  /* ============================================================ */

  const $ = id => document.getElementById(id);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const submitBtn = $("submit"), done = $("done");
  const pre = FORM.questions.map((q, i) => Object.assign({ idx: i }, q));
  const STORE = "rsvp-v2-" + FORM.id;   // remembers this phone already submitted
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function readSent() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function saveSent(v) { try { localStorage.setItem(STORE, v); } catch (e) {} }

  // ---- Build the page ----
  document.title = FORM.title;
  $("title").textContent = FORM.title;

  function renderInto(list, container) { list.forEach(q => {
    const id = "q" + q.idx;
    if (q.type === "choice" || q.type === "checkbox") {
      const fs = el("fieldset", "card");
      fs.dataset.q = q.idx;
      const lg = el("legend", null, q.title);
      fs.append(lg);
      if (q.help) fs.append(el("p", "help", q.help));
      const opts = el("div", "opts");
      q.options.forEach(o => {
        const lab = el("label", "opt");
        const inp = document.createElement("input");
        inp.type = q.type === "choice" ? "radio" : "checkbox";
        inp.name = id;
        inp.value = o;
        lab.append(inp, el("span", null, o));
        opts.append(lab);
      });
      fs.append(opts);
      if (q.type === "choice") {
        const clear = el("button", "clear", "Clear selection");
        clear.type = "button";
        clear.hidden = true;
        clear.addEventListener("click", () => { fs.querySelectorAll("input").forEach(r => { r.checked = false; }); clear.hidden = true; });
        opts.addEventListener("change", () => { clear.hidden = false; });
        fs.append(clear);
      }
      fs.append(el("p", "error"));
      container.append(fs);
    } else {
      const card = el("div", "card");
      card.dataset.q = q.idx;
      const lab = el("label", null, q.title);
      lab.htmlFor = id;
      const f = q.type === "long" ? document.createElement("textarea") : document.createElement("input");
      if (q.type !== "long") f.type = "text";
      if (/name/i.test(q.title)) f.autocomplete = "name";
      f.id = id;
      f.placeholder = "Your answer";
      card.append(lab, f, el("p", "error"));
      container.append(card);
    }
  }); }
  renderInto(pre, $("pre"));

  function valueOf(q) {
    if (q.type === "choice") { const r = document.querySelector(`input[name="q${q.idx}"]:checked`); return r ? [r.value] : []; }
    if (q.type === "checkbox") return Array.from(document.querySelectorAll(`input[name="q${q.idx}"]:checked`)).map(c => c.value);
    const v = $("q" + q.idx).value.trim(); return v ? [v] : [];
  }
  function validate(list) {
    let first = null;
    list.forEach(q => {
      const card = document.querySelector(`[data-q="${q.idx}"]`);
      const missing = q.required && valueOf(q).length === 0;
      card.classList.toggle("invalid", missing);
      card.querySelector(".error").textContent = missing ? "This is a required question" : "";
      if (missing && !first) first = card;
    });
    if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
    return !first;
  }
  function body() {
    const b = new URLSearchParams();
    pre.forEach(q => valueOf(q).forEach(v => b.append(q.entry, v)));
    return b.toString();
  }
  async function send(b) {
    // Google doesn't let other sites read its reply ("no-cors"),
    // so we send the answers and trust they landed, like a normal form.
    await fetch(`https://docs.google.com/forms/d/e/${FORM.id}/formResponse`, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: b
    });
  }

  function lock() {
    document.querySelectorAll("#pre input, #pre button").forEach(n => { n.disabled = true; });
    submitBtn.hidden = true;
    done.textContent = FORM.confirmation;
  }

  submitBtn.addEventListener("click", async () => {
    if (!validate(pre)) return;
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";
    try {
      await send(body());
      saveSent("yes");
      lock();
      burst();
    } catch (e) {
      console.warn("Send failed", e);
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit";
      done.textContent = "That didn’t go through. Check your connection and try again.";
    }
  });

  if (readSent()) { $("pre").hidden = true; lock(); }

  /* ================= ORNAMENTS + SNOW ================= */
  const c1 = $("fallers"), x1 = c1.getContext("2d");
  const c2 = $("burst"), x2 = c2.getContext("2d");
  const COLORS = ["#b8262b", "#d93b3f", "#e9b23c", "#f2c14e", "#2f6b3a", "#3f8a4a", "#c0c4cc"];
  let w = 0, h = 0, snow = [], balls = [];
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];

  function makeFlake(any) {
    const r = rand(1, 3.2);
    return { x: rand(0, w), y: any ? rand(0, h) : -6, r, vy: r * 0.3 + rand(0.2, 0.5), ph: rand(0, 6.28), sw: rand(0.2, 0.6), a: rand(0.5, 0.9) };
  }
  function ball(x, y, vx, vy, delay) {
    return { x, y, vx, vy, r: rand(9, 18), color: pick(COLORS), rot: rand(-0.4, 0.4), vr: rand(-0.06, 0.06), a: 1, life: 0, delay, stripe: Math.random() < 0.35 };
  }

  // Opening/submit burst: quick, full-screen, from the bottom corners and center.
  function burst() {
    if (reduceMotion) return;
    const g = 0.5, reach = Math.sqrt(2 * g * h);
    const n = Math.round(Math.min(170, Math.max(90, (w * h) / 3500)));
    for (let i = 0; i < n; i++) {
      const o = i % 3;
      const x0 = o === 0 ? rand(-20, w * 0.12) : o === 1 ? rand(w * 0.88, w + 20) : rand(w * 0.4, w * 0.6);
      const vy = -reach * rand(0.6, 1.05), tApex = -vy / g;
      balls.push(ball(x0, h + 20, (rand(-0.05, 1.05) * w - x0) / tApex, vy, Math.floor(rand(0, 18))));
    }
  }
  // Transition: ornaments rain down from above.
  function ornamentRain() {
    const n = Math.round(Math.min(200, Math.max(110, (w * h) / 2600)));
    for (let i = 0; i < n; i++) balls.push(ball(rand(-10, w + 10), rand(-h * 0.8, -30), rand(-0.6, 0.6), rand(8, 13), Math.floor(rand(0, 8))));
  }

  function drawBall(b) {
    const ctx = x2;
    ctx.save();
    ctx.globalAlpha = b.a;
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);
    // cap + loop
    ctx.fillStyle = "#c9a04a";
    ctx.fillRect(-b.r * 0.32, -b.r - b.r * 0.32, b.r * 0.64, b.r * 0.36);
    ctx.strokeStyle = "#c9a04a"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, -b.r - b.r * 0.42, b.r * 0.16, 0, Math.PI * 2); ctx.stroke();
    // ball
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2); ctx.fill();
    if (b.stripe) { ctx.fillStyle = "rgba(255,244,224,0.85)"; ctx.fillRect(-b.r, -b.r * 0.18, b.r * 2, b.r * 0.36); }
    // shine
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath(); ctx.ellipse(-b.r * 0.38, -b.r * 0.38, b.r * 0.26, b.r * 0.16, -0.7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    for (const c of [c1, c2]) { c.width = w * dpr; c.height = h * dpr; }
    x1.setTransform(dpr, 0, 0, dpr, 0, 0); x2.setTransform(dpr, 0, 0, dpr, 0, 0);
    snow = [];   // no snow indoors
    if (reduceMotion) draw();
  }
  function draw() {
    x1.clearRect(0, 0, w, h);
    for (const f of snow) {
      x1.fillStyle = `rgba(255,255,255,${f.a})`;
      x1.beginPath(); x1.arc(f.x, f.y, f.r, 0, Math.PI * 2); x1.fill();
    }
    x2.clearRect(0, 0, w, h);
    balls.forEach(b => { if (b.delay <= 0) drawBall(b); });
  }
  function tick() {
    for (const f of snow) {
      f.ph += 0.01; f.y += f.vy; f.x += Math.sin(f.ph) * f.sw;
      if (f.y > h + 6) Object.assign(f, makeFlake(false));
    }
    for (const b of balls) {
      if (b.delay > 0) { b.delay--; continue; }
      b.life++;
      b.vy += 0.5;
      if (b.vy > 7) b.vy = 7;
      b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      if (b.life > 150) b.a -= 0.02;
    }
    balls = balls.filter(b => b.a > 0 && b.y < h + 60);
    draw();
    requestAnimationFrame(tick);
  }
  window.addEventListener("resize", resize);
  resize();
  if (!reduceMotion) { burst(); requestAnimationFrame(tick); }
</script>
</body>
